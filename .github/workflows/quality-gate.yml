name: AVGUST CARE 360 — Quality Gate

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  static-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: API and backup integration tests
        run: npm run test:integration

      - name: Build distribution
        run: npm run build
